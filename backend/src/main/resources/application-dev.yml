spring:
  datasource:
    url: jdbc:mysql://localhost:3306/prizmabrixx_crm_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1000}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration


server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:super_secret_jwt_key_for_dev_only_change_me_in_prod}
  expiration: 86400000 # 24 hours in ms
  refresh-expiration: 604800000 # 7 days in ms

cors:
  allowed-origins: "http://localhost:5173"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
