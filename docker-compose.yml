version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: prizmabrixx_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: prizmabrixx_crm_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
